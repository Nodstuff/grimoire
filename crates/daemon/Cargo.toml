[package]
name = "grimoire"
version = "0.4.1"
edition.workspace = true
license.workspace = true

[dependencies]
grimoire-store = { path = "../store" }
rmcp = { version = "3.1", features = ["server", "transport-streamable-http-server"] }
axum = { version = "0.8", features = ["ws"] }
tower-http = { version = "0.6", features = ["fs"] }
tokio = { version = "1", features = ["macros", "rt-multi-thread", "signal", "process", "time"] }
uuid.workspace = true
serde.workspace = true
serde_json.workspace = true
schemars = "1"
anyhow = "1"
clap = { version = "4", features = ["derive"] }
tracing = "0.1"
chrono = "0.4"
reqwest = { version = "0.12", default-features = false, features = ["json"] }
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
ed25519-dalek = "3"
hex = "0.4"
getrandom = "0.4"
keyring = { version = "3", features = ["apple-native"] }
iroh = "1.1.0"
sha2 = "0.11"
data-encoding = "2"
yrs = { version = "0.27", features = ["sync"] }
futures-util = "0.3.34"
base64 = "0.23.1"
rust-embed = "8.12"
iroh-mdns-address-lookup = "0.5.0"
