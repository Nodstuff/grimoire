[package]
name = "taisce"
version = "0.8.0"
edition.workspace = true
license.workspace = true

[dependencies]
taisce-store = { path = "../store" }
rusqlite.workspace = true
rmcp = { version = "3.2", features = ["server", "transport-streamable-http-server"] }
axum = "0.8"
tower-http = { version = "0.6", features = ["fs", "limit"] }
tokio = { version = "1", features = ["macros", "rt-multi-thread", "signal", "process", "time"] }
uuid.workspace = true
serde.workspace = true
serde_json.workspace = true
schemars = "1"
anyhow = "1"
clap = { version = "4", features = ["derive", "env"] }
tracing = "0.1"
chrono = "0.4"
reqwest = { version = "0.13.5", default-features = false, features = ["json", "rustls-no-provider", "http2"] }
rustls = { version = "0.23.45", default-features = false, features = ["ring", "std"] }
# APNs provider JWTs (ES256); already in the tree under rustls
ring = "0.17.14"
url = "2.5.8"
# conditional-ui: the discoverable-credential sign-in (no allowCredentials:
# the server never hands out who is enrolled)
webauthn-rs = { version = "0.5.5", features = ["conditional-ui"] }
# webauthn-rs links OpenSSL; vendor it so the binary (and the cross-built
# server) never depends on a system libssl
openssl = { version = "0.10.81", features = ["vendored"] }
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
tracing-appender = "0.2.5"
hex = "0.4"
getrandom = "0.4"
sha2 = "0.11"
futures-util = "0.3.34"
base64 = "0.23.1"
rust-embed = "8.12"
libc = "0.2"
regex = "1.13.1"
model2vec-rs = { version = "0.2.1", default-features = false, features = ["onig", "local-only"] }

[build-dependencies]

[dev-dependencies]
webauthn-authenticator-rs = { version = "0.5.5", default-features = false, features = ["softpasskey"] }
tempfile = "3.27.0"
tower = { version = "0.5.3", features = ["util"] }
