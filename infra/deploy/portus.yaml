# Portus standalone config for the Taisce server (hot-reloaded on edit).
# Issued from Let's Encrypt production (staging verified 2026-10-01).
dns_refresh_secs: 0

acme:
  directory: letsencrypt
  cache_dir: /var/lib/portus/acme
  challenge: tls-alpn-01

listeners:
  - port: 443
    protocol: HTTPS
    tls:
      acme:
        domains: [taisce.null.ie]
    routes:
      # Agent Fabric's runtime channel (ADR 0006): gRPC from a runtime (Workbox
      # on a Mac) to the daemon's own loopback gRPC port (taisce.service,
      # TAISCE_RUNTIME_GRPC_PORT). `protocol: GRPC` makes portus speak HTTP/2
      # to the backend. The longest path prefix wins, so this route's place
      # in the list does not matter.
      # - Set NO timeout: one deadline would cover the whole stream and cut it.
      # - max_request_body_bytes MUST be set, to the largest value (u64::MAX).
      #   Unset (or 0) means portus's default of 10 MiB, counted over ALL the
      #   bytes a client sends on one stream: a long-lived stream would be
      #   killed with an HTTP/2 error (not a 413) once it had sent that much.
      - hosts: [taisce.null.ie]
        paths: [{ path: /taisce.runtime.v1.Runtime/, type: Prefix }]
        protocol: GRPC
        max_request_body_bytes: 18446744073709551615
        backends:
          - address: "127.0.0.1:7426"
      - hosts: [taisce.null.ie]
        backends:
          - address: "127.0.0.1:7425"
        # = the daemon's EPUB upload cap (library.rs MAX_BODY_BYTES, 128 MiB:
        # one 100 MB EPUB plus multipart framing); every other route keeps
        # its own smaller axum limit. Change the two together.
        max_request_body_bytes: 134217728
        response_headers:
          set:
            Strict-Transport-Security: "max-age=31536000; includeSubDomains"
