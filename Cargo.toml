[workspace]
members = ["crates/store", "crates/daemon", "crates/shell"]
resolver = "2"

[workspace.package]
edition = "2024"
license = "MIT"

[workspace.dependencies]
rusqlite = { version = "0.37", features = ["bundled"] }
uuid = { version = "1", features = ["v7", "serde"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
