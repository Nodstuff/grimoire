name: Taisce
options:
  bundleIdPrefix: ie.null
  deploymentTarget:
    iOS: "26.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "6.0"
    SWIFT_STRICT_CONCURRENCY: complete
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
packages:
  TaisceKit:
    path: ../TaisceKit
targets:
  Taisce:
    type: application
    platform: iOS
    deploymentTarget: "26.0"
    sources:
      - Taisce
    dependencies:
      - package: TaisceKit
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: ie.null.taisce
        TARGETED_DEVICE_FAMILY: "1,2"
        # Mac Catalyst comes later; flip to YES when the Mac pass starts
        SUPPORTS_MACCATALYST: NO
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations: "UIInterfaceOrientationPortrait UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight"
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPad: "UIInterfaceOrientationPortrait UIInterfaceOrientationPortraitUpsideDown UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight"
        CODE_SIGN_STYLE: Automatic
        DEVELOPMENT_TEAM: 6UP35L9425
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
    info:
      path: Taisce/Info.plist
      properties:
        CFBundleDisplayName: Taisce
        # the OAuth redirect (ie.null.taisce:/oauth/callback);
        # ASWebAuthenticationSession catches it, this makes the scheme ours
        CFBundleURLTypes:
          - CFBundleURLName: ie.null.taisce.oauth
            CFBundleURLSchemes: [ie.null.taisce]
        # plain HTTP to a daemon on this device / the local network only;
        # remote servers must be HTTPS
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true
          NSExceptionDomains:
            localhost:
              NSExceptionAllowsInsecureHTTPLoads: true
        NSLocalNetworkUsageDescription: Taisce connects to your server on this network.
  TaisceTests:
    type: bundle.unit-test
    platform: iOS
    deploymentTarget: "26.0"
    sources:
      - TaisceTests
    # TaisceKit comes through the host app (BUNDLE_LOADER): linking the
    # package here too turns it into a shared framework and breaks the app's link
    dependencies:
      - target: Taisce
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: ie.null.taisce.tests
        GENERATE_INFOPLIST_FILE: YES
        CODE_SIGN_STYLE: Automatic
        DEVELOPMENT_TEAM: 6UP35L9425
  TaisceUITests:
    type: bundle.ui-testing
    platform: iOS
    deploymentTarget: "26.0"
    sources:
      - TaisceUITests
    dependencies:
      - target: Taisce
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: ie.null.taisce.uitests
        GENERATE_INFOPLIST_FILE: YES
        CODE_SIGN_STYLE: Automatic
        DEVELOPMENT_TEAM: 6UP35L9425
        TEST_TARGET_NAME: Taisce
schemes:
  Taisce:
    build:
      targets:
        Taisce: all
    test:
      targets:
        - TaisceTests
        - TaisceUITests
