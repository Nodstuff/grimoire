name: Taisce
options:
  bundleIdPrefix: ie.null
  deploymentTarget:
    iOS: "26.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "6.0"
    SWIFT_STRICT_CONCURRENCY: complete
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
packages:
  TaisceKit:
    path: ../TaisceKit
targets:
  Taisce:
    type: application
    platform: iOS
    deploymentTarget: "26.0"
    sources:
      - Taisce
    dependencies:
      - package: TaisceKit
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: ie.null.taisce
        TARGETED_DEVICE_FAMILY: "1,2"
        # Mac Catalyst comes later; flip to YES when the Mac pass starts
        SUPPORTS_MACCATALYST: NO
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations: "UIInterfaceOrientationPortrait UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight"
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPad: "UIInterfaceOrientationPortrait UIInterfaceOrientationPortraitUpsideDown UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight"
        CODE_SIGN_STYLE: Automatic
    info:
      path: Taisce/Info.plist
      properties:
        CFBundleDisplayName: Taisce
        # plain HTTP to a daemon on this device / the local network only;
        # remote servers must be HTTPS
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true
          NSExceptionDomains:
            localhost:
              NSExceptionAllowsInsecureHTTPLoads: true
        NSLocalNetworkUsageDescription: Taisce connects to your server on this network.
