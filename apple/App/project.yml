name: Taisce
options:
  bundleIdPrefix: ie.null
  deploymentTarget:
    iOS: "26.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "6.0"
    SWIFT_STRICT_CONCURRENCY: complete
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
packages:
  TaisceKit:
    path: ../TaisceKit
targets:
  Taisce:
    type: application
    platform: iOS
    deploymentTarget: "26.0"
    sources:
      - path: Taisce
        excludes: ["Resources/reladraw/**"]
      # reladraw is ES modules importing each other by relative path: a
      # folder reference keeps them together as reladraw/ in the bundle
      - path: Taisce/Resources/reladraw
        type: folder
        buildPhase: resources
    dependencies:
      - package: TaisceKit
    settings:
      base:
        # overridable for UI test runs on the Mac, which must not run as the
        # installed app (its data, preferences and Keychain):
        # xcodebuild … TAISCE_BUNDLE_ID=ie.null.taisce.migtest
        TAISCE_BUNDLE_ID: ie.null.taisce
        PRODUCT_BUNDLE_IDENTIFIER: $(TAISCE_BUNDLE_ID)
        # 6 = Mac Catalyst with the Mac idiom ("Optimize interface for
        # Mac"): native-size text and AppKit-style controls, not the iPad
        # UI scaled to 77%. The editor is UITextView, which the Mac idiom
        # supports fully (it loses only the input accessory bar; the menu
        # bar carries those commands instead).
        TARGETED_DEVICE_FAMILY: "1,2,6"
        SUPPORTS_MACCATALYST: YES
        SUPPORTS_MAC_DESIGNED_FOR_IPHONE_IPAD: NO
        # one bundle id on every platform: the server's APNs topic and
        # the Keychain items are ie.null.taisce on the Mac too
        DERIVE_MACCATALYST_PRODUCT_BUNDLE_IDENTIFIER: NO
        ENABLE_HARDENED_RUNTIME: YES
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations: "UIInterfaceOrientationPortrait UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight"
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPad: "UIInterfaceOrientationPortrait UIInterfaceOrientationPortraitUpsideDown UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight"
        CODE_SIGN_STYLE: Automatic
        DEVELOPMENT_TEAM: 6UP35L9425
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
      configs:
        Debug:
          INFOPLIST_FILE: Support/Info-Debug.plist
          # APNs (push): a Debug build's token is a sandbox one
          CODE_SIGN_ENTITLEMENTS: Support/Taisce-Debug.entitlements
          # the Mac: push, no App Sandbox (runnable code blocks run your own tools)
          "CODE_SIGN_ENTITLEMENTS[sdk=macosx*]": Support/Taisce-Mac-Debug.entitlements
          # no universal links in Debug (scratch daemons are http; the Mac
          # test runs need no Associated Domains in the profile): the
          # custom-scheme sign-in, as every build before
          TAISCE_APP_LINK_HOST: ""
        Release:
          CODE_SIGN_ENTITLEMENTS: Support/Taisce-Release.entitlements
          "CODE_SIGN_ENTITLEMENTS[sdk=macosx*]": Support/Taisce-Mac-Release.entitlements
          # the server whose /oauth/app-callback this build claims (applinks +
          # webcredentials in the Release entitlements, TaisceAppLinkHosts in
          # Info.plist so the app knows): the sign-in redirect only this app can catch
          TAISCE_APP_LINK_HOST: taisce.null.ie
    info:
      path: Taisce/Info.plist
      properties:
        CFBundleDisplayName: Taisce
        # the Associated Domains host (AppLinks.hosts): empty in Debug
        TaisceAppLinkHosts: $(TAISCE_APP_LINK_HOST)
        # the OAuth redirect (ie.null.taisce:/oauth/callback);
        # ASWebAuthenticationSession catches it, this makes the scheme ours
        CFBundleURLTypes:
          - CFBundleURLName: ie.null.taisce.oauth
            CFBundleURLSchemes: [ie.null.taisce]
        # no NSAppTransportSecurity: Release is HTTPS only, no exceptions.
        # Debug builds use Support/Info-Debug.plist, this plus the
        # loopback exception for scratch daemons; keep the two in step.
        NSLocalNetworkUsageDescription: Taisce connects to your server on this network.
        # APNs: silent content-available pushes wake the app for one catch-up
        UIBackgroundModes: [remote-notification]
  TaisceTests:
    type: bundle.unit-test
    platform: iOS
    deploymentTarget: "26.0"
    sources:
      - TaisceTests
    # TaisceKit comes through the host app (BUNDLE_LOADER): linking the
    # package here too turns it into a shared framework and breaks the app's link
    dependencies:
      - target: Taisce
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: ie.null.taisce.tests
        GENERATE_INFOPLIST_FILE: YES
        SUPPORTS_MACCATALYST: YES
        DERIVE_MACCATALYST_PRODUCT_BUNDLE_IDENTIFIER: NO
        CODE_SIGN_STYLE: Automatic
        DEVELOPMENT_TEAM: 6UP35L9425
  TaisceUITests:
    type: bundle.ui-testing
    platform: iOS
    deploymentTarget: "26.0"
    sources:
      - TaisceUITests
    # the runner seeds and checks a scratch daemon over plain http on loopback
    info:
      path: TaisceUITests/Info.plist
      properties:
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true
    dependencies:
      - target: Taisce
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: ie.null.taisce.uitests
        GENERATE_INFOPLIST_FILE: YES
        SUPPORTS_MACCATALYST: YES
        DERIVE_MACCATALYST_PRODUCT_BUNDLE_IDENTIFIER: NO
        CODE_SIGN_STYLE: Automatic
        DEVELOPMENT_TEAM: 6UP35L9425
        TEST_TARGET_NAME: Taisce
schemes:
  Taisce:
    build:
      targets:
        Taisce: all
    test:
      targets:
        - TaisceTests
        - TaisceUITests
